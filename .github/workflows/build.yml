name: Build Marble Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: "Custom Kernel Name"
        required: false
        type: string
        default: "-CustomKernel"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc curl git gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev zstd wget

      - name: Clone Toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain

      - name: Clone kernel source
        run: |
          git clone --depth=1 -b melt-rebase https://github.com/Pzqqt/android_kernel_xiaomi_marble.git android-kernel

      - name: Build kernel
        working-directory: ./android-kernel
        run: |
          export PATH="${GITHUB_WORKSPACE}/toolchain/bin:${PATH}"
          make O=out ARCH=arm64 vendor/marble_defconfig
          make -j$(nproc --all) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- CC=clang LOCALVERSION="${{ github.event.inputs.kernel_name }}"

      - name: Upload Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Image-${{ github.event.inputs.kernel_name }}
          path: ./android-kernel/out/arch/arm64/boot/Image
          if-no-files-found: ignore
          retention-days: 7
          

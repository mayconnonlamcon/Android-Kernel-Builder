name: Build Marble Kernel

on:
  workflow_dispatch:
    inputs:
      build_none:
        description: "Build: none (baseline no-root)"
        type: boolean
        default: false
      build_kernelsu:
        description: "Build: KernelSU (no SUSFS)"
        type: boolean
        default: false
      build_kernelsu_next:
        description: "Build: KernelSU-Next"
        type: boolean
        default: false
      build_sukisu_ultra:
        description: "Build: SukiSU Ultra"
        type: boolean
        default: false
      build_resukisu:
        description: "Build: ReSukiSU"
        type: boolean
        default: false
      build_kittisu:
        description: "Build: KittiSU"
        type: boolean
        default: false
      build_kernelsu_pershoot:
        description: "Build: KernelSU-Next (Pershoot)"
        type: boolean
        default: false
      enable_susfs:
        description: "Enable SUSFS (applies to KSUNext, SukiSU Ultra, ReSukiSU, KittiSU, Pershoot)"
        type: boolean
        default: false
      susfs_version:
        description: SUSFS preset version
        type: choice
        default: v2.2.0
        options:
          - v2.2.0
          - v2.1.0
          - custom
      susfs_ref:
        description: "SUSFS branch/tag/commit (only for custom version)"
        required: false
        default: ""
      source_repo:
        description: Kernel source repository
        required: true
        default: Pzqqt/android_kernel_xiaomi_marble
      source_ref:
        description: Kernel source branch, tag, or commit
        required: true
        default: melt-rebase
      build_scope:
        description: Build target set
        type: choice
        default: image-only
        options:
          - image-only
          - full
      enable_ccache:
        description: Enable ccache
        type: boolean
        default: true
      create_draft_release:
        description: Create a draft GitHub release when the build succeeds
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.enable_susfs }}-${{ inputs.build_scope }}
  cancel-in-progress: false

jobs:
  setup:
    name: Generate matrix and validate policy
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate builder policy
        run: |
          for test_script in tests/test-*.sh; do
            [ -f "$test_script" ] && env -u SOURCE_REPO -u SOURCE_REF -u MANAGER -u MANAGER_REF -u ENABLE_SUSFS \
              -u SUSFS_VERSION -u SUSFS_KERNEL_BRANCH -u SUSFS_REF -u SUSFS_EXPECTED_VERSION \
              bash "${test_script}" || true
          done

      - name: Generate build matrix
        id: gen
        env:
          BUILD_NONE: ${{ inputs.build_none }}
          BUILD_KERNELSU: ${{ inputs.build_kernelsu }}
          BUILD_KERNELSU_NEXT: ${{ inputs.build_kernelsu_next }}
          BUILD_SUKISU_ULTRA: ${{ inputs.build_sukisu_ultra }}
          BUILD_RESUKISU: ${{ inputs.build_resukisu }}
          BUILD_KITTISU: ${{ inputs.build_kittisu }}
          BUILD_KERNELSU_PERSHOOT: ${{ inputs.build_kernelsu_pershoot }}
          ENABLE_SUSFS: ${{ inputs.enable_susfs }}
        run: |
          JSON="["
          COMMA=""
          if [ "$BUILD_NONE" == "true" ]; then
            JSON="$JSON{\"manager\":\"none\",\"susfs\":false}"
            COMMA=","
          fi
          if [ "$BUILD_KERNELSU" == "true" ]; then
            JSON="$JSON$COMMA{\"manager\":\"kernelsu\",\"susfs\":false}"
            COMMA=","
          fi
          if [ "$BUILD_KERNELSU_NEXT" == "true" ]; then
            JSON="$JSON$COMMA{\"manager\":\"kernelsu-next\",\"susfs\":$ENABLE_SUSFS}"
            COMMA=","
          fi
          if [ "$BUILD_SUKISU_ULTRA" == "true" ]; then
            JSON="$JSON$COMMA{\"manager\":\"sukisu-ultra\",\"susfs\":$ENABLE_SUSFS}"
            COMMA=","
          fi
          if [ "$BUILD_RESUKISU" == "true" ]; then
            JSON="$JSON$COMMA{\"manager\":\"resukisu\",\"susfs\":$ENABLE_SUSFS}"
            COMMA=","
          fi
          if [ "$BUILD_KITTISU" == "true" ]; then
            JSON="$JSON$COMMA{\"manager\":\"kittisu\",\"susfs\":$ENABLE_SUSFS}"
            COMMA=","
          fi
          if [ "$BUILD_KERNELSU_PERSHOOT" == "true" ]; then
            JSON="$JSON$COMMA{\"manager\":\"kernelsu-pershoot\",\"susfs\":$ENABLE_SUSFS}"
          fi
          JSON="$JSON]"
          echo "matrix={\"include\":$JSON}" >> $GITHUB_OUTPUT

  build:
    name: Build (${{ matrix.manager }} | SUSFS: ${{ matrix.susfs }})
    needs: setup
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    env:
      OUT_DIR: "out"
      ARCH: "arm64"
      DEFCONFIG_NAME: "vendor/marble_defconfig"

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install Ubuntu 22.04 Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc curl git zip unzip wget zstd \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            libssl-dev libelf-dev libfl-dev bison flex \
            python3 python-is-python3 libarchive-tools ccache rsync

      - name: Clone Toolchain (Proton Clang)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain

      - name: Clone kernel source
        run: |
          git clone --depth=1 -b "${{ inputs.source_ref }}" "https://github.com/${{ inputs.source_repo }}.git" android-kernel

      - name: Setup Manager and Apply All SUSFS Patches
        working-directory: ./android-kernel
        run: |
          MANAGER="${{ matrix.manager }}"
          USE_SUSFS="${{ matrix.susfs }}"
          
          if [ "$MANAGER" != "none" ]; then
            echo "Setting up root manager: $MANAGER"
            rm -rf KernelSU drivers/kernelsu
            
            case "$MANAGER" in
              kernelsu)
                curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
                ;;
              kernelsu-next)
                curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/main/kernel/setup.sh" | bash -s main
                ;;
              sukisu-ultra)
                curl -LSs "https://raw.githubusercontent.com/sukisu-ultra/sukisu-ultra/main/kernel/setup.sh" | bash -s main
                ;;
              resukisu)
                curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main
                ;;
              kittisu)
                curl -LSs "https://raw.githubusercontent.com/terebiko/KittiSU/main/kernel/setup.sh" | bash -s main
                ;;
              kernelsu-pershoot)
                curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/main/kernel/setup.sh" | bash -s main
                ;;
            esac
            
            echo -e "\nCONFIG_KPROBES=y" >> ./arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
            echo -e "\nCONFIG_HAVE_KPROBES=y" >> ./arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
            echo -e "\nCONFIG_KPROBE_EVENTS=y" >> ./arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          fi
          
          if [ "$USE_SUSFS" == "true" ] && [ "$MANAGER" != "none" ]; then
            SUSFS_BRANCH="${{ inputs.susfs_version }}"
            if [ "$SUSFS_BRANCH" == "custom" ] && [ -n "${{ inputs.susfs_ref }}" ]; then
              SUSFS_BRANCH="${{ inputs.susfs_ref }}"
            fi
            
            git clone --depth=1 -b "$SUSFS_BRANCH" https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu || git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu
            
            # Copy fs and include directories
            FS_DIR=$(find ../susfs4ksu -type d -name "fs" | head -n 1)
            [ -d "$FS_DIR" ] && cp -r "$FS_DIR"/* ./fs/ || true
            
            INCLUDE_DIR=$(find ../susfs4ksu -type d -name "include" | head -n 1)
            [ -d "$INCLUDE_DIR" ] && cp -r "$INCLUDE_DIR"/* ./include/ || true
            
            # Tự động quét và apply toàn bộ tất cả các patch của susfs4ksu
            for patch_file in $(find ../susfs4ksu -name "*.patch" | sort); do
              echo "Applying patch: $patch_file"
              if [[ "$patch_file" == *"kernelsu"* || "$patch_file" == *"ksu"* ]] && [ -d "KernelSU" ]; then
                cp "$patch_file" ./KernelSU/
                cd KernelSU && patch -p1 < "$(basename "$patch_file")" || true
                cd ..
              else
                patch -p1 < "$patch_file" || true
              fi
            done
            
            echo -e "\nCONFIG_KSU_SUSFS=y" >> ./arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
            echo -e "\nCONFIG_KSU_SUSFS_HAS_ALLOWED_PATH_REG=y" >> ./arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
            echo -e "\nCONFIG_KSU_SUSFS_HAS_OPEN_REDIRECT=y" >> ./arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          fi

      - name: Make defconfig
        working-directory: ./android-kernel
        run: |
          export PATH="${GITHUB_WORKSPACE}/toolchain/bin:${PATH}"
          make -j$(nproc --all) O=${{ env.OUT_DIR }} ARCH=${{ env.ARCH }} LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- CC=clang ${{ env.DEFCONFIG_NAME }}

      - name: Build kernel
        working-directory: ./android-kernel
        run: |
          export PATH="${GITHUB_WORKSPACE}/toolchain/bin:${PATH}"
          CCACHE_BIN=""
          [ "${{ inputs.enable_ccache }}" == "true" ] && CCACHE_BIN="ccache"
          make -j$(nproc --all) O=${{ env.OUT_DIR }} ARCH=${{ env.ARCH }} LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- CC="$CCACHE_BIN clang"

      - name: Upload Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Image-${{ matrix.manager }}-susfs${{ matrix.susfs }}
          path: ./android-kernel/${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image
          if-no-files-found: ignore
          retention-days: 7

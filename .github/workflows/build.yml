name: "Build kernels"

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: 'Kernel name'
        required: true
        type: string
        default: '-CustomKernel'

      build_none:
        description: 'Build: none (baseline no-root)'
        required: false
        type: boolean
        default: false

      build_ksu:
        description: 'Build: KernelSU (no SUSFS)'
        required: false
        type: boolean
        default: false

      build_ksu_next:
        description: 'Build: KernelSU-Next'
        required: false
        type: boolean
        default: false

      build_sukisu_ultra:
        description: 'Build: SukiSU Ultra'
        required: false
        type: boolean
        default: false

      build_resukisu:
        description: 'Build: ReSukiSU'
        required: false
        type: boolean
        default: false

      build_kittisu:
        description: 'Build: KittiSU'
        required: false
        type: boolean
        default: false

      enable_susfs:
        description: 'Enable SUSFS (applies to KSUNext, SukiSU Ultra, ReSukiSU, KittiSU)'
        required: false
        type: boolean
        default: false

      susfs_version:
        description: 'SUSFS preset version'
        required: true
        type: choice
        default: 'v2.2.0'
        options:
          - 'v2.2.0'
          - 'v1.5.5'
          - 'v1.5.2'

      susfs_custom:
        description: 'SUSFS branch/tag/commit (only for custom version)'
        required: false
        type: string
        default: ''

      kernel_repo:
        description: 'Kernel source repository'
        required: true
        type: string
        default: 'Pzqqt/android_kernel_xiaomi_marble'

      kernel_branch:
        description: 'Kernel source branch, tag, or commit'
        required: true
        type: string
        default: 'melt-rebase'

      build_target:
        description: 'Build target set'
        required: true
        type: choice
        default: 'image-only'
        options:
          - 'image-only'
          - 'anykernel3'
          - 'boot-img'

      enable_ccache:
        description: 'Enable ccache'
        required: false
        type: boolean
        default: true

      create_release:
        description: 'Create a draft GitHub release when the build succeeds'
        required: false
        type: boolean
        default: false

env:
  OUT_DIR: "out"
  ARCH: "arm64"
  # QUAN TRỌNG: Hãy chắc chắn tên defconfig này đúng với kernel của bạn!
  DEFCONFIG_NAME: "vendor/marble_defconfig" 

jobs:
  Build-Kernel:
    name: "Build kernel"
    runs-on: ubuntu-latest
    
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Install prerequisites"
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc curl git zip ftp gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev lftp zstd wget libfl-dev python3 python-is-python3 libarchive-tools ccache

      - name: "Clone kernel source"
        run: |
          echo "Downloading Kernel Source..."
          KERNEL_REPO="https://github.com/${{ github.event.inputs.kernel_repo }}.git"
          KERNEL_BRANCH="${{ github.event.inputs.kernel_branch }}"
          
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" android-kernel

      - name: "Update KernelSU or Variants"
        working-directory: ./android-kernel
        run: |
          if [ "${{ github.event.inputs.build_none }}" == "true" ]; then
            echo "Selected: Build none. Skipping KernelSU."
          else
            echo "Setting up root variant..."
            rm -rf KernelSU drivers/kernelsu
            
            if [ "${{ github.event.inputs.build_ksu }}" == "true" ]; then
               curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
            elif [ "${{ github.event.inputs.build_ksu_next }}" == "true" ]; then
               curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/main/kernel/setup.sh" | bash -s main
            elif [ "${{ github.event.inputs.build_sukisu_ultra }}" == "true" ]; then
               curl -LSs "https://raw.githubusercontent.com/sukisu-ultra/sukisu-ultra/main/kernel/setup.sh" | bash -s main
            elif [ "${{ github.event.inputs.build_resukisu }}" == "true" ]; then
               curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main
            elif [ "${{ github.event.inputs.build_kittisu }}" == "true" ]; then
               curl -LSs "https://raw.githubusercontent.com/terebiko/KittiSU/main/kernel/setup.sh" | bash -s main
            fi
            
            echo -e "\nCONFIG_KPROBES=y" >> ./arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
            echo -e "\nCONFIG_HAVE_KPROBES=y" >> ./arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
            echo -e "\nCONFIG_KPROBE_EVENTS=y" >> ./arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          fi

      - name: "Setup SUSFS (If enabled)"
        working-directory: ./android-kernel
        if: ${{ github.event.inputs.build_none != 'true' && github.event.inputs.enable_susfs == 'true' }}
        run: |
           echo "SUSFS is enabled but script is missing. Add your SUSFS patch script here."

      - name: "Make defconfig"
        working-directory: ./android-kernel
        run: |
          make -j$(nproc --all) O=${{ env.OUT_DIR }} ARCH=${{ env.ARCH }} CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- ${{ env.DEFCONFIG_NAME }}

      - name: "Build kernel"
        working-directory: ./android-kernel
        run: |
          if [ "${{ github.event.inputs.enable_ccache }}" == "true" ]; then
            CC="ccache gcc"
          else
            CC="gcc"
          fi
          
          # Biến LOCALVERSION sẽ đổi tên kernel theo thông tin bạn nhập
          make -j$(nproc --all) O=${{ env.OUT_DIR }} ARCH=${{ env.ARCH }} CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CC="$CC" LOCALVERSION="${{ github.event.inputs.kernel_name }}"

      - name: "Upload Image"
        uses: actions/upload-artifact@v4
        with:
          name: Image${{ github.event.inputs.kernel_name }}
          path: ./android-kernel/${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image
          if-no-files-found: ignore
          retention-days: 7

      - name: "Upload dtb"
        uses: actions/upload-artifact@v4
        with:
          name: dtb${{ github.event.inputs.kernel_name }}
          path: ./android-kernel/${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/dts/**/*.dtb
          if-no-files-found: ignore
          retention-days: 7

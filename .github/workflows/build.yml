name: "Build kernels"

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: 'Tên Kernel của bạn (Ví dụ: -QuyenKernel)'
        required: true
        type: string
        default: '-CustomKernel'

      build_none:
        description: 'Build: none (baseline no-root)'
        required: false
        type: boolean
        default: false

      build_ksu:
        description: 'Build: KernelSU (no SUSFS)'
        required: false
        type: boolean
        default: false

      build_ksu_next:
        description: 'Build: KernelSU-Next'
        required: false
        type: boolean
        default: false

      build_sukisu_ultra:
        description: 'Build: SukiSU Ultra'
        required: false
        type: boolean
        default: false

      build_resukisu:
        description: 'Build: ReSukiSU'
        required: false
        type: boolean
        default: false

      build_kittisu:
        description: 'Build: KittiSU'
        required: false
        type: boolean
        default: false

      enable_susfs:
        description: 'Enable SUSFS (applies to KSUNext, SukiSU Ultra, ReSukiSU, KittiSU)'
        required: false
        type: boolean
        default: true

      susfs_version:
        description: 'SUSFS preset version (nếu ô custom bên dưới trống)'
        required: true
        type: choice
        default: 'gki-android14-5.10'
        options:
          - 'gki-android14-5.10'
          - 'gki-android14-6.1'
          - 'gki-android13-5.10'
          - 'gki-android13-5.15'
          - 'gki-android12-5.10'

      susfs_custom:
        description: 'Tự gõ tên branch SUSFS muốn dùng (Ưu tiên hơn menu trên, để trống nếu dùng menu)'
        required: false
        type: string
        default: ''

      kernel_repo:
        description: 'Kernel source repository'
        required: true
        type: string
        default: 'Pzqqt/android_kernel_xiaomi_marble'

      kernel_branch:
        description: 'Kernel source branch, tag, or commit'
        required: true
        type: string
        default: 'melt-rebase'

      build_target:
        description: 'Build target set'
        required: true
        type: choice
        default: 'image-only'
        options:
          - 'image-only'
          - 'anykernel3'
          - 'boot-img'

      enable_ccache:
        description: 'Enable ccache'
        required: false
        type: boolean
        default: true

      create_release:
        description: 'Create a draft GitHub release when the build succeeds'
        required: false
        type: boolean
        default: false

env:
  OUT_DIR: "out"
  ARCH: "arm64"
  DEFCONFIG_NAME: "vendor/marble_defconfig" 

jobs:
  Build-Kernel:
    name: "Build kernel"
    runs-on: ubuntu-22.04 
    
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Install prerequisites"
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc curl git zip ftp gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev lftp zstd wget libfl-dev python3 python-is-python3 libarchive-tools ccache

      - name: "Clone Toolchain (Proton Clang)"
        run: |
          echo "Downloading Proton Clang Toolchain..."
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain
          
      - name: "Clone kernel source"
        run: |
          echo "Downloading Kernel Source..."
          KERNEL_REPO="https://github.com/${{ github.event.inputs.kernel_repo }}.git"
          KERNEL_BRANCH="${{ github.event.inputs.kernel_branch }}"
          
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" android-kernel

      - name: "Update KernelSU or Variants"
        working-directory: ./android-kernel
        run: |
          if [ "${{ github.event.inputs.build_none }}" == "true" ]; then
            echo "Selected: Build none. Skipping KernelSU."
          else
            echo "Setting up root variant..."
            rm -rf KernelSU drivers/kernelsu
            
            if [ "${{ github.event.inputs.build_ksu }}" == "true" ]; then
               curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
            elif [ "${{ github.event.inputs.build_ksu_next }}" == "true" ]; then
               curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/main/kernel/setup.sh" | bash -s main
            elif [ "${{ github.event.inputs.build_sukisu_ultra }}" == "true" ]; then
               curl -LSs "https://raw.githubusercontent.com/sukisu-ultra/sukisu-ultra/main/kernel/setup.sh" | bash -s main
            elif [ "${{ github.event.inputs.build_resukisu }}" == "true" ]; then
               curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main
            elif [ "${{ github.event.inputs.build_kittisu }}" == "true" ]; then
               curl -LSs "https://raw.githubusercontent.com/terebiko/KittiSU/main/kernel/setup.sh" | bash -s main
            fi
            
            echo -e "\nCONFIG_KPROBES=y" >> ./arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
            echo -e "\nCONFIG_HAVE_KPROBES=y" >> ./arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
            echo -e "\nCONFIG_KPROBE_EVENTS=y" >> ./arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          fi

      - name: "Setup and Apply SUSFS (DEBUG MODE)"
        working-directory: ./android-kernel
        if: ${{ github.event.inputs.build_none != 'true' && github.event.inputs.enable_susfs == 'true' }}
        run: |
          set -x
          if [ -n "${{ github.event.inputs.susfs_custom }}" ]; then
            SUSFS_VER="${{ github.event.inputs.susfs_custom }}"
          else
            SUSFS_VER="${{ github.event.inputs.susfs_version }}"
          fi
          
          echo "=== [DEBUG] Starting SUSFS setup for branch/tag: $SUSFS_VER ==="
          rm -rf ../susfs4ksu
          git clone --depth=1 -b "$SUSFS_VER" https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu
          
          echo "=== [DEBUG] Listing directory structure of ../susfs4ksu ==="
          find ../susfs4ksu -maxdepth 4 -not -path '*/.*'
          
          echo "=== [DEBUG] Finding all patch files ==="
          find ../susfs4ksu -name "*.patch"
          
          echo "=== [DEBUG] Locating specific patches dynamically ==="
          KSU_PATCH=$(find ../susfs4ksu -name "*10_enable_susfs_for_ksu.patch" | head -n 1)
          KERNEL_PATCH=$(find ../susfs4ksu -name "*50_add_susfs_in_kernel*" | head -n 1)
          
          echo "Found KSU patch path: $KSU_PATCH"
          echo "Found Kernel patch path: $KERNEL_PATCH"
          
          if [ -f "$KSU_PATCH" ]; then
            cp "$KSU_PATCH" ./KernelSU/
          else
            echo "[WARNING] Could not find 10_enable_susfs_for_ksu.patch automatically!"
          fi
          
          if [ -f "$KERNEL_PATCH" ]; then
            cp "$KERNEL_PATCH" ./50_add_susfs_in_kernel-.patch
          else
            echo "[WARNING] Could not find kernel patch automatically!"
          fi
          
          echo "=== [DEBUG] Copying fs and include components ==="
          FS_DIR=$(find ../susfs4ksu -type d -name "fs" | head -n 1)
          if [ -d "$FS_DIR" ]; then
            cp -r "$FS_DIR"/* ./fs/ || true
          fi
          
          INCLUDE_DIR=$(find ../susfs4ksu -type d -name "include" | head -n 1)
          if [ -d "$INCLUDE_DIR" ]; then
            cp -r "$INCLUDE_DIR"/* ./include/ || true
          fi
          
          echo "=== [DEBUG] Applying KSU patch (with dry-run test) ==="
          cd KernelSU
          if [ -f "10_enable_susfs_for_ksu.patch" ]; then
            patch -p1 --dry-run < 10_enable_susfs_for_ksu.patch || echo "[DRY-RUN FAILED] KSU patch has conflicts or issues"
            patch -p1 < 10_enable_susfs_for_ksu.patch || true
          else
            echo "[ERROR] Patch file missing inside KernelSU folder"
          fi
          cd ..
          
          echo "=== [DEBUG] Applying Kernel source patch (with dry-run test) ==="
          if [ -f "50_add_susfs_in_kernel-.patch" ]; then
            patch -p1 --dry-run < 50_add_susfs_in_kernel-.patch || echo "[DRY-RUN FAILED] Kernel patch has conflicts or issues"
            patch -p1 < 50_add_susfs_in_kernel-.patch || true
          else
            echo "[ERROR] Kernel patch file missing"
          fi
          
          echo "=== [DEBUG] Appending SUSFS configs ==="
          echo -e "\nCONFIG_KSU_SUSFS=y" >> ./arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo -e "\nCONFIG_KSU_SUSFS_HAS_ALLOWED_PATH_REG=y" >> ./arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo -e "\nCONFIG_KSU_SUSFS_HAS_OPEN_REDIRECT=y" >> ./arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "=== [DEBUG] SUSFS setup step completed ==="

      - name: "Make defconfig"
        working-directory: ./android-kernel
        run: |
          export PATH="${GITHUB_WORKSPACE}/toolchain/bin:${PATH}"
          make -j$(nproc --all) O=${{ env.OUT_DIR }} ARCH=${{ env.ARCH }} LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- CC=clang ${{ env.DEFCONFIG_NAME }}

      - name: "Build kernel"
        working-directory: ./android-kernel
        run: |
          export PATH="${GITHUB_WORKSPACE}/toolchain/bin:${PATH}"
          
          if [ "${{ github.event.inputs.enable_ccache }}" == "true" ]; then
            CCACHE="ccache"
          else
            CCACHE=""
          fi
          
          make -j$(nproc --all) O=${{ env.OUT_DIR }} ARCH=${{ env.ARCH }} LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- CC="$CCACHE clang" LOCALVERSION="${{ github.event.inputs.kernel_name }}"

      - name: "Upload Image"
        uses: actions/upload-artifact@v4
        with:
          name: Image${{ github.event.inputs.kernel_name }}
          path: ./android-kernel/${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image
          if-no-files-found: ignore
          retention-days: 7

      - name: "Upload dtb"
        uses: actions/upload-artifact@v4
        with:
          name: dtb${{ github.event.inputs.kernel_name }}
          path: ./android-kernel/${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/dts/**/*.dtb
          if-no-files-found: ignore
          retention-days: 7
          
